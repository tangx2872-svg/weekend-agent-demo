<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>参数纠错 · 投影回放</title><style>*{box-sizing:border-box}body{margin:0;font:25px 'Microsoft YaHei';color:#172b46;background:#fff;padding:22px 30px}h1{font-size:30px;color:#143f85;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1.25fr 1.2fr;gap:24px}section{background:#eef3fc;padding:20px;min-height:278px}h2{font-size:25px;color:#143f85;margin:0 0 20px}pre{font:25px/1.6 Consolas,'Microsoft YaHei';white-space:pre-wrap;margin:0}.note{font-size:20px;color:#5c6d84;margin-top:18px}button{font:20px 'Microsoft YaHei';padding:8px 20px;margin-right:12px;color:#143f85;background:white;border:1px solid #143f85;cursor:pointer}.warn{color:#b65d27}.good{color:#218364}</style><h1 id="title">错误分支：先拒绝，再修正</h1><div class="grid" id="capture"><section><h2>当前状态</h2><pre id="state"></pre></section><section><h2>工具请求 · Action</h2><pre id="action"></pre></section><section><h2>返回结果 · Observation</h2><pre id="observation"></pre></section></div><p class="note" id="note"></p><button id="next">下一步</button><button id="reset">重置</button><p class="note">固定教学数据；规则模拟决策；仅局部候选检查，不连接真实LLM。</p><script src="engine.js"></script><script>
let s;const $=id=>document.getElementById(id);function reset(){s=TravelAgent.create({fault:'wrong_city',weather:'rain'});$('state').textContent='目标城市：Hangzhou\n天气：尚未获得\n预算：1000元';$('action').textContent='等待开始';$('observation').textContent='尚无结果';$('note').textContent='点击下一步，观察错误请求及其拒绝原因。';$('title').textContent='错误分支：先拒绝，再修正'}function next(){if(s.calls>=3)return;const e=TravelAgent.step(s);const a=e.action,o=e.observation;$('state').textContent='目标：Hangzhou\n天气：'+(s.observed.weather?s.observed.weather.condition:'尚未获得')+'\n工具调用：'+s.calls+' / 8';$('action').textContent=a.name+'\ncall_id: '+a.call_id+'\n'+Object.entries(a.arguments).map(([k,v])=>k+': '+v).join('\n');if(!o.ok){$('title').textContent='① 错误请求：城市与目标不一致';$('observation').textContent='ok: false\n'+o.error+'\nexpected_city: '+o.expected_city;$('observation').className='warn';$('note').textContent='Runtime拒绝当前请求；城市不一致属于任务语义检查，不是日期格式错误。'}else if(a.name==='get_weather'){$('title').textContent='② 修正请求：取得新的天气观察';$('observation').textContent='ok: true\ncondition: '+o.data.condition+'\nsource: fixture';$('observation').className='good';$('note').textContent='请求已修正为Hangzhou；rain是模拟观察，写入当前上下文。'}else{$('title').textContent='③ 下一轮：观察改变搜索条件';$('observation').textContent='ok: true\n'+o.data.name+'\nindoor: '+o.data.indoor;$('observation').className='good';$('note').textContent='已知下雨，所以下一步改为搜索室内地点；尚未核验完整两日行程。'}}$('next').onclick=next;$('reset').onclick=reset;reset();
</script></html>
