<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周末出行助理 · 教学模拟</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#172b46;font:18px 'Microsoft YaHei',sans-serif;padding:30px 42px}h1{font-size:35px;color:#143f85;margin:0 0 9px}.sub{font-size:15px;color:#5c6d84;line-height:1.5}.layout{display:grid;grid-template-columns:1fr 1.15fr 1.12fr;gap:22px;margin-top:25px}section{background:white;padding:23px;min-height:490px;border-top:4px solid #143f85}h2{font-size:22px;margin:0 0 18px}label{display:block;margin:14px 0 6px;color:#5c6d84}select,input,button{font:17px 'Microsoft YaHei';padding:10px;border:1px solid #b9c9e2;background:white;border-radius:5px}select{width:100%}input{width:110px}button{margin:15px 6px 0 0;cursor:pointer;color:#143f85}button.primary{background:#143f85;color:white;border-color:#143f85}.task{font-size:21px;line-height:1.65;background:#eef3fc;padding:16px}.log{max-height:378px;overflow:auto}.entry{border-bottom:1px solid #edf1f7;padding:12px 0;font-size:16px;line-height:1.6}.entry strong{display:block;color:#143f85}.good{color:#218364}.warn{color:#ae5425}.summary{font-size:25px;font-weight:bold;color:#143f85;margin:20px 0 10px}.route{line-height:1.7;font-size:17px}.costs{font-size:16px;line-height:1.8}.footer{margin-top:20px;font-size:15px;color:#5c6d84}button:disabled{opacity:.5}#progress{font-size:16px;margin-bottom:12px;color:#218364}</style><h1>周末出行助理</h1><div class="sub">教学模拟：演示任务、工具与反馈流程。天气、地点、营业时间和费用均为预设示例，不是实时出行信息；不调用模型、不购买、不预约。</div><div class="layout"><section><h2>① 你只需说明目标</h2><div class="task">帮我安排杭州两日游，<br>预算 <span id="budgetLabel">1000</span> 元，想轻松一点。</div><label>本地预算（不含往返杭州的大交通）</label><input id="budget" type="number" value="1000" min="100" step="100"><label>演示天气</label><select id="weather"><option value="sun">晴天</option><option value="rain">下雨：触发调整</option></select><label>系统配置</label><select id="mode"><option value="agent">分步骤 + 模拟工具反馈</option><option value="text">预设一次回答</option></select><button class="primary" id="next">下一步</button><button id="play">自动播放</button><button id="reset">重新开始</button><p class="sub">“下一步”观察决策与返回结果；切换天气会重置，避免混入旧结果。</p></section><section><h2>② 助理正在做什么？</h2><div id="progress">等待开始</div><div class="log" id="log" aria-live="polite"></div></section><section><h2>③ 最终计划与预算</h2><div id="status" class="summary">尚未生成</div><div id="route" class="route">先获取信息，再整理计划。</div><div id="costs" class="costs"></div><p id="verify" class="sub"></p><button id="download">保存执行记录</button></section></div><div class="footer">操作建议：先跑晴天流程 → 切换下雨看路线调整 → 把预算改成 500 元看系统请求补充选择。演示地点“展馆 A / 商圈 B”为虚构占位；示例住宿按 1 晚计算。</div><script>
const $=id=>document.getElementById(id);let s,timer,trace;const fixture={sun:{weather:'晴，适合短时户外',d1:'湖边短停 → 附近餐饮 → 商圈 B 休息',d2:'展馆 A → 午餐 → 返程准备',traffic:120,stay:360,food:240,ticket:80,reserve:100},rain:{weather:'下雨，优先室内',d1:'展馆 A → 同片区餐饮 → 商圈 B',d2:'室内体验 → 咖啡休息 → 返程准备',traffic:140,stay:360,food:240,ticket:60,reserve:100}};function reset(){clearInterval(timer);timer=null;trace=[];s={step:0,done:false,mode:$('mode').value,weather:$('weather').value,budget:Number($('budget').value),checks:{weather:false,budget:false,traffic:false,hours:false,adjust:false}};$('budgetLabel').textContent=s.budget;$('log').replaceChildren();$('status').textContent='尚未生成';$('status').className='summary';$('route').textContent='先获取信息，再整理计划。';$('costs').textContent='';$('verify').textContent='';$('progress').textContent='等待开始'}function log(title,text){trace.push({step:s.step,title,text});let e=document.createElement('div');e.className='entry';let a=document.createElement('strong');a.textContent=title;e.append(a,document.createTextNode(text));$('log').append(e);$('log').scrollTop=99999;$('progress').textContent=`步骤 ${s.step} / 7`}function stop(msg,good){s.done=true;clearInterval(timer);timer=null;$('status').textContent=msg;$('status').className='summary '+(good?'good':'warn')}function next(){if(s.done)return;s.step++;const f=fixture[s.weather];if(s.mode==='text'){log('一次性预设回答','建议第一天湖边与商圈，第二天展馆；安排公交，预算约 900 元。');s.checks.budget=true;s.checks.traffic=true;$('route').textContent='D1 湖边 + 商圈；D2 展馆。公交出行，预算约 900 元。';$('verify').textContent='此预设回答覆盖预算、交通；未运行天气查询、营业核对与反馈调整。并非所有聊天模型都只能做到这些。';stop('回答已生成；未核验',false);return}switch(s.step){case 1:log('理解目标','两天、1 晚、预算 '+s.budget+' 元、少走路；默认已在杭州，不含城际交通。');break;case 2:log('天气工具（模拟）',f.weather);s.checks.weather=true;break;case 3:log('地点筛选（模拟）',s.weather==='rain'?'因下雨移除湖边停留，改选室内展馆与商圈。':'选择同片区、少量停留点，避免密集打卡。');s.checks.adjust=true;break;case 4:log('地图工具（模拟）','按片区安排，优先公共交通；减少来回折返。');s.checks.traffic=true;break;case 5:log('营业信息（模拟）','展馆 A 的预设可访问时段覆盖计划；真实出行前须重新核对。');s.checks.hours=true;break;case 6:const sum=Object.entries(f).filter(([k,v])=>typeof v==='number').reduce((a,[k,v])=>a+v,0);s.total=sum;s.checks.budget=true;log('预算核对',`交通 ${f.traffic} + 住宿 ${f.stay} + 餐饮 ${f.food} + 活动 ${f.ticket} + 备用 ${f.reserve} = ${sum} 元`);if(sum>s.budget){$('verify').textContent='现有方案超出预算。可以改为一日游、取消住宿，或调整预算；没有自动替用户决定。';stop('需要确认：预算不足',false)}break;case 7:$('route').textContent='第 1 天：'+f.d1+'。 第 2 天：'+f.d2+'。';$('costs').textContent=`示例总额 ${s.total} 元 / 预算 ${s.budget} 元（住宿 1 晚）`;$('verify').textContent='已覆盖天气、预算、交通、营业核对、反馈调整 5 项；这些信息均为模拟。';log('生成计划','按天气输出路线，并说明预算边界；没有产生订单。');stop('示例计划已完成',true)}}$('next').onclick=next;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(next,1300)};$('reset').onclick=reset;['weather','mode','budget'].forEach(id=>$(id).onchange=reset);$('download').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({disclosure:'规则驱动教学模拟，非真实模型实验',state:s,trace},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='travel-demo-log.json';a.click();URL.revokeObjectURL(u)};reset();
</script></html>
